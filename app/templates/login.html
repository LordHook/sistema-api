{% extends "base.html" %}

{% block title %}Iniciar Sesión - CCO{% endblock %}

{% block public_content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-logo">
            <div class="logo-icon">🛡️</div>
            <h1>Sistema CCO</h1>
            <p>Centro de Monitoreo y Videovigilancia</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" id="login-form">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" class="form-control" id="username" name="username" 
                       placeholder="Ingresa tu usuario" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" 
                       placeholder="Ingresa tu contraseña" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-block" id="btn-login">
                Iniciar Sesión
            </button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.8rem;">
            Sistema de Gestión de Horarios v1.0
        </p>
    </div>
</div>
{% endblock %}
